server {
    server_name audio.appfoundry.cc;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://unix:/run/voice-note/voice-note.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SSL managed by Certbot — do not edit below this line manually
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/audio.appfoundry.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.appfoundry.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = audio.appfoundry.cc) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name audio.appfoundry.cc;
    return 404;
}
